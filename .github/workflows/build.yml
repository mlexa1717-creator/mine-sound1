name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        working-directory: phrase-combo-fabric-1.21.11-project
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: phrase-combo-1.21.11
          path: |
            phrase-combo-fabric-1.21.11-project/build/libs/*.jar
            !phrase-combo-fabric-1.21.11-project/build/libs/*-sources.jar
          if-no-files-found: error
